name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  config:
    name: Load Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read supported Python versions
        id: read
        # Single source of truth for the supported Python versions lives in
        # .github/python-versions.json — add a new version there and both this
        # matrix and the linter workflow pick it up automatically.
        run: echo "versions=$(jq -c . .github/python-versions.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: config
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # pyspark is an optional, Java-backed dependency that the test suite does not
        # exercise (imports are guarded by tidyverse_to_pandas/_optional_pyspark.py), so
        # it is intentionally omitted here (the "spark" extra is not synced) to keep the
        # matrix fast and installable on 3.14.
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest test/
