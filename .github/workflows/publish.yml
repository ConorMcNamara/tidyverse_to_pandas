name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets
# are stored. Configure the trusted publisher on PyPI first (see below), then
# cut a Release whose tag matches the version in pyproject.toml.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   Project name:     tidyverse-to-pandas
#   Owner:            ConorMcNamara
#   Repository name:  tidyverse_to_pandas
#   Workflow name:    publish.yml
#   Environment:      pypi

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual runs (e.g. first publish / re-publish)

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
