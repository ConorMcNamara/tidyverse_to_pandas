name: Formatting and Docstring Generation

on:
  push:
    branches:
      - main  # Trigger on pushes to the 'main' branch
      - master
  pull_request:
    branches:
      - main  # Trigger on pull requests targeting the 'main' branch
      - master

jobs:
  config:
    name: Load Python version
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read newest supported Python version
        id: read
        # Lint against the newest version listed in the single source of truth,
        # .github/python-versions.json (shared with the tests workflow).
        run: echo "version=$(jq -r '.[-1]' .github/python-versions.json)" >> "$GITHUB_OUTPUT"

  formatting:
    needs: config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ needs.config.outputs.python-version }}
        run: uv python install ${{ needs.config.outputs.python-version }}

      - name: Check code style with ruff
        # Use the version-pinned ruff from the dev group (uv.lock) so the lint
        # rule set is reproducible and does not drift with new ruff releases.
        # Scope the formatters to our own source: uv creates the virtualenv at
        # ./.venv inside the repo, and a bare `.` / `**/*.py` / `find .` would
        # recurse into it and try to reformat installed dependencies.
        run: |
          uv run ruff format tidyverse_to_pandas test
          uv run ruff check --output-format=github tidyverse_to_pandas test  # Check code style with ruff

      - name: Auto-format code with autopep8
        run: |
          uvx autopep8 --in-place --aggressive --max-line-length 120 --recursive tidyverse_to_pandas test  # Fix formatting issues with autopep8

      - name: Generate docstrings with numpydoc style
        run: |
          find tidyverse_to_pandas test -name "*.py" -exec uvx pydocstringformatter -w --style numpydoc --numpydoc-section-order --numpydoc-name-type-spacing --numpydoc-section-spacing --numpydoc-section-hyphen-length --no-final-period {} +

      # - name: Check type hints with mypy
      #   run: |
      #     mypy . --ignore-missing-imports --install-types # Run mypy for type checking

      - name: Commit and push changes (if any)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-format code with ruff, autopep8 and pydocstringformatter"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
